name: HoboStreamer Builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this build, e.g. 0.1.0-test1"
        required: true
        default: "0.1.0-test1"
        type: string
      publish_release:
        description: "Publish these builds as a GitHub Release"
        required: true
        default: false
        type: boolean

  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: read

concurrency:
  group: hobostreamer-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  BUILD_CONFIG: Release

jobs:
  metadata:
    name: Build metadata
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            TAG="${GITHUB_REF_NAME}"
            PUBLISH="true"
          else
            VERSION="${{ inputs.version }}"
            TAG="${{ inputs.version }}"
            PUBLISH="${{ inputs.publish_release }}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-26
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        target: [arm64, x86_64]

    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create local version tag for manual build
        if: github.event_name == 'workflow_dispatch'
        run: git tag -f '${{ needs.metadata.outputs.tag }}' "$GITHUB_SHA"

      - name: Set up macOS runner
        id: setup
        run: |
          if [[ -d /Applications/Xcode_26.5.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          fi
          local xcode_cas_path="${HOME}/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"
          mkdir -p "${xcode_cas_path}"
          print "xcodeCasPath=${xcode_cas_path}" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Build
        uses: ./.github/actions/build-obs
        env:
          XCODE_CAS_PATH: ${{ steps.setup.outputs.xcodeCasPath }}
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
        with:
          target: ${{ matrix.target }}
          config: ${{ env.BUILD_CONFIG }}
          codesign: false

      - name: Package DMG
        uses: ./.github/actions/package-obs
        with:
          target: ${{ matrix.target }}
          config: ${{ env.BUILD_CONFIG }}
          package: true
          codesign: false
          notarize: false

      - name: Verify macOS WebRTC runtime in DMG
        run: |
          set -euo pipefail

          if [[ '${{ matrix.target }}' == 'arm64' ]]; then
            dmg="$(find build_macos -maxdepth 1 -type f -name 'obs-studio-*-macos-apple.dmg' | head -n1)"
            expected_arch='arm64'
          else
            dmg="$(find build_macos -maxdepth 1 -type f -name 'obs-studio-*-macos-intel.dmg' | head -n1)"
            expected_arch='x86_64'
          fi

          [[ -n "$dmg" ]] || { echo "DMG not found"; exit 1; }

          mount_point="${RUNNER_TEMP}/hobostreamer-dmg-${{ matrix.target }}"
          rm -rf "$mount_point"
          mkdir -p "$mount_point"

          cleanup() {
            hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"

          app="$(find "$mount_point" -maxdepth 2 -type d -name '*.app' | head -n1)"
          [[ -n "$app" ]] || { echo "No .app bundle found in DMG"; exit 1; }

          plugin="$(find "$app" -type f \( -name 'obs-webrtc' -o -name 'obs-webrtc.so' -o -name 'obs-webrtc.dylib' \) | head -n1)"
          [[ -n "$plugin" ]] || {
            echo "DMG is missing the obs-webrtc plugin binary"
            find "$app" -iname '*webrtc*' -print || true
            exit 1
          }

          echo "Packaged WebRTC plugin: $plugin"
          file "$plugin"

          archs="$(lipo -archs "$plugin")"
          echo "WebRTC plugin architectures: $archs"
          [[ " $archs " == *" $expected_arch "* ]] || {
            echo "obs-webrtc does not contain expected architecture: $expected_arch"
            exit 1
          }

          otool -L "$plugin" | tee "${RUNNER_TEMP}/obs-webrtc-${{ matrix.target }}-otool.txt"

          if grep -qi 'datachannel' "${RUNNER_TEMP}/obs-webrtc-${{ matrix.target }}-otool.txt"; then
            datachannel="$(find "$app" \( -type f -o -type l \) -iname '*datachannel*.dylib' | head -n1)"
            [[ -n "$datachannel" ]] || {
              echo "obs-webrtc dynamically links LibDataChannel but the DMG does not bundle its dylib"
              find "$app" -iname '*datachannel*' -print || true
              exit 1
            }

            echo "Packaged LibDataChannel: $datachannel"
            file "$datachannel"
            datachannel_archs="$(lipo -archs "$datachannel")"
            echo "LibDataChannel architectures: $datachannel_archs"
            [[ " $datachannel_archs " == *" $expected_arch "* ]] || {
              echo "LibDataChannel does not contain expected architecture: $expected_arch"
              exit 1
            }
          else
            echo "obs-webrtc does not dynamically reference LibDataChannel; treating it as statically linked."
          fi

          if grep -E '/Users/runner|/build_macos|/private/tmp' "${RUNNER_TEMP}/obs-webrtc-${{ matrix.target }}-otool.txt"; then
            echo "obs-webrtc contains an invalid build-machine library path"
            exit 1
          fi

          echo "macOS $expected_arch DMG contains a verified WebRTC/WHIP runtime."

      - name: Prepare release file
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ '${{ matrix.target }}' == 'arm64' ]]; then
            src="$(find build_macos -maxdepth 1 -type f -name 'obs-studio-*-macos-apple.dmg' | head -n1)"
            dst="dist/HoboStreamer-macOS-Apple.dmg"
          else
            src="$(find build_macos -maxdepth 1 -type f -name 'obs-studio-*-macos-intel.dmg' | head -n1)"
            dst="dist/HoboStreamer-macOS-Intel.dmg"
          fi
          [[ -n "$src" ]] || { echo "DMG not found"; exit 1; }
          cp -v "$src" "$dst"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hobostreamer-macos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux x86_64
    runs-on: ubuntu-26.04
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create local version tag for manual build
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: git tag -f '${{ needs.metadata.outputs.tag }}' "$GITHUB_SHA"

      - name: Build with WebRTC/WHIP
        uses: ./.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
        with:
          target: x86_64
          config: ${{ env.BUILD_CONFIG }}

      - name: Verify Linux WebRTC plugin
        shell: bash
        run: |
          set -euo pipefail

          install_root="build_ubuntu/install/${BUILD_CONFIG}"

          plugin="$(find "$install_root" -type f -name 'obs-webrtc.so' | head -n1)"
          [[ -n "$plugin" ]] || {
            echo "obs-webrtc.so was not built"
            exit 1
          }

          libdatachannel="$(find "$install_root" \( -type f -o -type l \) -name 'libdatachannel.so*' | head -n1)"
          [[ -n "$libdatachannel" ]] || {
            echo "libdatachannel was not installed into the OBS staging tree"
            exit 1
          }

          echo "Found WebRTC plugin: $plugin"
          echo "Found LibDataChannel: $libdatachannel"

          mapfile -t lib_dirs < <(
            find "$install_root" \( -type f -o -type l \) \
              \( -name '*.so' -o -name '*.so.*' \) \
              -printf '%h\n' |
              sort -u
          )

          [[ "${#lib_dirs[@]}" -gt 0 ]] || {
            echo "No library directories found in OBS install tree"
            exit 1
          }

          library_path="$(IFS=:; echo "${lib_dirs[*]}")"

          echo "Verifying plugin using staged OBS libraries:"
          echo "$library_path"

          LD_LIBRARY_PATH="$library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ldd "$plugin" | tee /tmp/obs-webrtc-ldd.txt

          if grep -q 'not found' /tmp/obs-webrtc-ldd.txt; then
            echo "obs-webrtc.so has unresolved staged runtime libraries"
            exit 1
          fi

      - name: Package Linux
        uses: ./.github/actions/package-obs
        with:
          target: x86_64
          config: ${{ env.BUILD_CONFIG }}
          package: true

      - name: Verify Linux package contains working WebRTC runtime
        shell: bash
        run: |
          set -euo pipefail

          deb="$(find build_ubuntu -maxdepth 1 -type f -name 'obs-studio-*-x86_64-ubuntu-gnu.deb' | head -n1)"
          [[ -n "$deb" ]] || {
            echo "DEB not found"
            exit 1
          }

          package_root="/tmp/hobostreamer-deb-root"
          rm -rf "$package_root"
          mkdir -p "$package_root"
          dpkg-deb -x "$deb" "$package_root"

          plugin="$(find "$package_root" -type f -name 'obs-webrtc.so' | head -n1)"
          [[ -n "$plugin" ]] || {
            echo "DEB is missing obs-webrtc.so"
            exit 1
          }

          libdatachannel="$(find "$package_root" \( -type f -o -type l \) -name 'libdatachannel.so*' | head -n1)"
          [[ -n "$libdatachannel" ]] || {
            echo "DEB is missing bundled libdatachannel"
            exit 1
          }

          echo "Packaged WebRTC plugin: $plugin"
          echo "Packaged LibDataChannel: $libdatachannel"

          mapfile -t lib_dirs < <(
            find "$package_root" \( -type f -o -type l \) \
              \( -name '*.so' -o -name '*.so.*' \) \
              -printf '%h\n' |
              sort -u
          )

          [[ "${#lib_dirs[@]}" -gt 0 ]] || {
            echo "No library directories found in DEB"
            exit 1
          }

          library_path="$(IFS=:; echo "${lib_dirs[*]}")"

          LD_LIBRARY_PATH="$library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ldd "$plugin" | tee /tmp/hobostreamer-packaged-webrtc-ldd.txt

          if grep -q 'not found' /tmp/hobostreamer-packaged-webrtc-ldd.txt; then
            echo "Packaged obs-webrtc.so has unresolved runtime libraries"
            exit 1
          fi

          echo "Linux DEB contains a resolvable WebRTC/WHIP runtime."

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          deb="$(find build_ubuntu -maxdepth 1 -type f -name 'obs-studio-*-x86_64-ubuntu-gnu.deb' | head -n1)"
          source_archive="$(find build_ubuntu -maxdepth 1 -type f -name 'obs-studio-*-sources.tar.gz' | head -n1)"
          [[ -n "$deb" ]] || { echo "DEB not found"; exit 1; }
          [[ -n "$source_archive" ]] || { echo "Source archive not found"; exit 1; }
          cp -v "$deb" dist/HoboStreamer-Linux-x86_64.deb
          cp -v "$source_archive" dist/HoboStreamer-Source.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hobostreamer-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    needs: metadata
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create local version tag for manual build
        if: github.event_name == 'workflow_dispatch'
        run: git tag -f '${{ needs.metadata.outputs.tag }}' "$env:GITHUB_SHA"

      - name: Prefetch OBS Windows dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Preset = Get-Content 'CMakePresets.json' -Raw | ConvertFrom-Json
          $Dependencies = (
            $Preset.configurePresets |
              Where-Object { $_.name -eq 'dependencies' }
          ).vendor.'obsproject.com/obs-studio'.dependencies

          $PrebuiltVersion = $Dependencies.prebuilt.version
          $QtVersion = $Dependencies.qt6.version

          $Files = @(
            @{ Tag = $PrebuiltVersion; Name = "windows-deps-$PrebuiltVersion-x86.zip"; Hash = $Dependencies.prebuilt.hashes.'windows-x86' },
            @{ Tag = $PrebuiltVersion; Name = "windows-deps-$PrebuiltVersion-x64.zip"; Hash = $Dependencies.prebuilt.hashes.'windows-x64' },
            @{ Tag = $QtVersion; Name = "windows-deps-qt6-$QtVersion-x64.zip"; Hash = $Dependencies.qt6.hashes.'windows-x64' }
          )

          New-Item -ItemType Directory -Force '.deps' | Out-Null

          foreach ($File in $Files) {
            $Destination = Join-Path '.deps' $File.Name
            $Downloaded = $false

            for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
              Write-Host "Downloading $($File.Name), attempt $Attempt/3"
              gh release download $File.Tag `
                --repo obsproject/obs-deps `
                --pattern $File.Name `
                --dir '.deps' `
                --clobber

              if ($LASTEXITCODE -eq 0 -and (Test-Path $Destination)) {
                $Downloaded = $true
                break
              }

              if ($Attempt -lt 3) {
                Start-Sleep -Seconds (5 * $Attempt)
              }
            }

            if (-not $Downloaded) {
              throw "Dependency was not downloaded: $($File.Name)"
            }

            $Actual = (Get-FileHash $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            $Expected = ([string]$File.Hash).ToLowerInvariant()

            if ($Actual -ne $Expected) {
              throw "SHA256 mismatch for $($File.Name): expected $Expected, got $Actual"
            }

            Write-Host "Verified $($File.Name)"
          }

      - name: Build
        uses: ./.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
          GPU_PRIORITY_VAL: ${{ secrets.GPU_PRIORITY_VAL }}
        with:
          target: x64
          config: ${{ env.BUILD_CONFIG }}

      - name: Package portable ZIP
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: ${{ env.BUILD_CONFIG }}

      - name: Verify Windows WebRTC runtime in portable ZIP
        run: |
          $ErrorActionPreference = 'Stop'

          $Zip = Get-ChildItem 'build_x64\obs-studio-*-windows-x64.zip' | Select-Object -First 1
          if (-not $Zip) { throw 'Windows portable ZIP was not created' }

          $VerifyRoot = Join-Path $env:RUNNER_TEMP 'hobostreamer-windows-webrtc'
          Remove-Item -Recurse -Force $VerifyRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $VerifyRoot | Out-Null
          Expand-Archive -Path $Zip.FullName -DestinationPath $VerifyRoot -Force

          $Plugin = Join-Path $VerifyRoot 'obs-plugins\64bit\obs-webrtc.dll'
          $DataChannel = Join-Path $VerifyRoot 'bin\64bit\datachannel.dll'

          if (-not (Test-Path $Plugin -PathType Leaf)) {
            throw "Portable ZIP is missing obs-webrtc.dll at $Plugin"
          }
          if (-not (Test-Path $DataChannel -PathType Leaf)) {
            throw "Portable ZIP is missing datachannel.dll at $DataChannel"
          }

          if ((Get-Item $Plugin).Length -le 0) { throw 'obs-webrtc.dll is empty' }
          if ((Get-Item $DataChannel).Length -le 0) { throw 'datachannel.dll is empty' }

          Write-Host "Verified WebRTC plugin: $Plugin"
          Write-Host "Verified LibDataChannel runtime: $DataChannel"
          Write-Host 'Windows portable package contains the required WebRTC/WHIP runtime.'

      - name: Build unsigned Windows installer
        run: |
          $ErrorActionPreference = 'Stop'
          $Zip = Get-ChildItem 'build_x64\obs-studio-*-windows-x64.zip' | Select-Object -First 1
          if (-not $Zip) { throw 'Windows ZIP was not created' }

          $Payload = Join-Path $PWD 'build_installer\payload'
          $Output = Join-Path $PWD 'build_installer\output'
          New-Item -ItemType Directory -Force -Path $Payload, $Output | Out-Null
          Expand-Archive -Path $Zip.FullName -DestinationPath $Payload -Force

          $PayloadWebRTC = Join-Path $Payload 'obs-plugins\64bit\obs-webrtc.dll'
          $PayloadDataChannel = Join-Path $Payload 'bin\64bit\datachannel.dll'
          if (-not (Test-Path $PayloadWebRTC -PathType Leaf)) { throw 'Installer payload is missing obs-webrtc.dll' }
          if (-not (Test-Path $PayloadDataChannel -PathType Leaf)) { throw 'Installer payload is missing datachannel.dll' }

          $ISCC = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $ISCC)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $ISCC)) {
            throw "Inno Setup not found at $ISCC"
          }

          & $ISCC '.github\installer\hobostreamer.iss' `
            "/DMyAppVersion=${{ needs.metadata.outputs.version }}" `
            "/DSourceDir=$Payload" `
            "/DOutputDir=$Output"

      - name: Verify Windows installer contains WebRTC runtime
        run: |
          $ErrorActionPreference = 'Stop'

          $Exe = Get-ChildItem 'build_installer\output\HoboStreamer-*-Windows-x64-Installer.exe' |
            Select-Object -First 1

          if (-not $Exe) {
            throw 'Windows installer missing'
          }

          if ($Exe.Length -le 1MB) {
            throw "Windows installer looks suspiciously small: $($Exe.Length) bytes"
          }

          # Basic PE executable sanity check.
          $Bytes = [System.IO.File]::ReadAllBytes($Exe.FullName)
          if ($Bytes.Length -lt 2 -or
              $Bytes[0] -ne 0x4D -or
              $Bytes[1] -ne 0x5A) {
            throw 'Generated Windows installer is not a valid PE executable'
          }

          $InstallRoot = Join-Path $env:RUNNER_TEMP 'hobostreamer-installer-test'
          $InstallLog = Join-Path $env:RUNNER_TEMP 'hobostreamer-installer-test.log'

          Remove-Item -Recurse -Force $InstallRoot -ErrorAction SilentlyContinue
          Remove-Item -Force $InstallLog -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $InstallRoot | Out-Null

          Write-Host "Testing installer:"
          Write-Host $Exe.FullName
          Write-Host "Temporary installation directory:"
          Write-Host $InstallRoot

          $Arguments = @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            '/SP-'
            '/CURRENTUSER'
            "/DIR=`"$InstallRoot`""
            "/LOG=`"$InstallLog`""
          )

          $Process = Start-Process `
            -FilePath $Exe.FullName `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru

          if ($Process.ExitCode -ne 0) {
            if (Test-Path $InstallLog) {
              Write-Host '---- Inno Setup log ----'
              Get-Content $InstallLog
              Write-Host '------------------------'
            }

            throw "Installer test failed with exit code $($Process.ExitCode)"
          }

          $ObsExe = Join-Path $InstallRoot 'bin\64bit\obs64.exe'
          $WebRTC = Join-Path $InstallRoot 'obs-plugins\64bit\obs-webrtc.dll'
          $DataChannel = Join-Path $InstallRoot 'bin\64bit\datachannel.dll'

          if (-not (Test-Path $ObsExe -PathType Leaf)) {
            throw "Installed package is missing obs64.exe at $ObsExe"
          }

          if (-not (Test-Path $WebRTC -PathType Leaf)) {
            throw "Installed package is missing obs-webrtc.dll at $WebRTC"
          }

          if (-not (Test-Path $DataChannel -PathType Leaf)) {
            throw "Installed package is missing datachannel.dll at $DataChannel"
          }

          if ((Get-Item $WebRTC).Length -le 0) {
            throw 'Installed obs-webrtc.dll is empty'
          }

          if ((Get-Item $DataChannel).Length -le 0) {
            throw 'Installed datachannel.dll is empty'
          }

          Write-Host "Verified OBS executable: $ObsExe"
          Write-Host "Verified WebRTC plugin: $WebRTC"
          Write-Host "Verified LibDataChannel runtime: $DataChannel"
          Write-Host 'Final Windows installer successfully installs the required WebRTC/WHIP runtime.'

      - name: Prepare release files
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $Zip = Get-ChildItem 'build_x64\obs-studio-*-windows-x64.zip' | Select-Object -First 1
          $Exe = Get-ChildItem 'build_installer\output\HoboStreamer-*-Windows-x64-Installer.exe' | Select-Object -First 1
          if (-not $Zip) { throw 'Windows ZIP missing' }
          if (-not $Exe) { throw 'Windows installer missing' }
          Copy-Item $Zip.FullName 'dist\HoboStreamer-Windows-x64-Portable.zip'
          Copy-Item $Exe.FullName 'dist\HoboStreamer-Windows-x64-Installer.exe'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hobostreamer-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-26.04
    needs: [metadata, macos, linux, windows]
    if: needs.metadata.outputs.publish == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: hobostreamer-*
          path: release
          merge-multiple: true

      - name: Generate HoboStreamer update manifest
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/make-hobostreamer-update-manifest.py \
            --release-dir release \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$GITHUB_SHA" \
            --output release/HoboStreamer-update.json
          cat release/HoboStreamer-update.json

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum \
            HoboStreamer-Windows-x64-Installer.exe \
            HoboStreamer-Windows-x64-Portable.zip \
            HoboStreamer-macOS-Apple.dmg \
            HoboStreamer-macOS-Intel.dmg \
            HoboStreamer-Linux-x86_64.deb \
            HoboStreamer-Source.tar.gz \
            HoboStreamer-update.json \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; replacing assets"
            gh release upload "$TAG" release/* --clobber
          else
            args=(
              "$TAG"
              release/*
              --title "HoboStreamer Studio $VERSION"
              --generate-notes
              --target "$GITHUB_SHA"
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
